name: Bug report
description: Something is wrong, missing or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please attach the diagnostics
        file, it is needed to look into almost every report.

        **Settings > Devices & Services > Deye Local**, three-dot menu on the entry,
        **Download diagnostics**. Serial numbers and Bluetooth addresses are removed from it, so it is safe to attach here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Which entity or setting, what it showed or did, and when.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a wrong value, what the inverter or the Deye app shows at the same moment.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Inverter model
      description: As printed on the label, for example SUN-6K-SG05LP1-EU.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Shown in HACS.
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Settings > About.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Drag the downloaded .json file into this box.
      placeholder: Drop the diagnostics file here.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any errors or warnings from Settings > System > Logs that mention Deye Local.
      render: text
